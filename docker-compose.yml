services:
  port_cleaner:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./port_cleaner/clean.sh:/clean.sh:ro
    entrypoint: ["/bin/sh", "/clean.sh"]
    environment:
      CLEAN_PORT: "9910"
    restart: "no"

  mongo:
    image: mongo:7
    ports:
      - "29017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "9081:9081"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: test_4g
      BRIDGE_URL: http://tcp_bridge:8081
      HOMOLOGATE_URL: ${HOMOLOGATE_URL:-}
      HOMOLOGATE_UNIT: ${HOMOLOGATE_UNIT:-UNIT111}
      HOMOLOGATE_TIMEOUT_S: ${HOMOLOGATE_TIMEOUT_S:-5}
      HOMOLOGATE_ENABLED: ${HOMOLOGATE_ENABLED:-1}
      HOMOLOGATE_RETRIES: ${HOMOLOGATE_RETRIES:-3}
      HOMOLOGATE_DEDUP_S: ${HOMOLOGATE_DEDUP_S:-30}
    depends_on:
      - mongo
    restart: unless-stopped

  tcp_bridge:
    build: ./tcp_bridge
    ports:
      - "9910:9910"
      - "8081:8081"
    environment:
      TCP_PORT: "9910"
      HTTP_PORT: "8081"
      BACKEND_URL: http://backend:9081
      IDLE_TIMEOUT_S: "300"
      ORPHAN_SWEEP_S: "30"
      FORWARD_LEGACY: "0"
    depends_on:
      port_cleaner:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8089:8089"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:

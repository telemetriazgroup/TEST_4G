name: test_4g_madurador_miami

services:
  port_cleaner:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./port_cleaner/clean.sh:/clean.sh:ro
    entrypoint: ["/bin/sh", "/clean.sh"]
    environment:
      CLEAN_PORT: "9917"
    restart: "no"

  mongo:
    image: mongo:7
    ports:
      - "29024:27017"
    volumes:
      - mongo_data_9917:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "19702:19702"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: test_4g_9917
      BRIDGE_URL: http://tcp_bridge:19802
      HOMOLOGATE_URL: ${HOMOLOGATE_URL:-}
      HOMOLOGATE_UNIT: ${HOMOLOGATE_UNIT:-UNIT111}
      HOMOLOGATE_TIMEOUT_S: ${HOMOLOGATE_TIMEOUT_S:-5}
      HOMOLOGATE_ENABLED: ${HOMOLOGATE_ENABLED:-1}
      HOMOLOGATE_RETRIES: ${HOMOLOGATE_RETRIES:-3}
      HOMOLOGATE_DEDUP_S: ${HOMOLOGATE_DEDUP_S:-30}
      HOMOLOGATE_QUEUE_INTERVAL_S: ${HOMOLOGATE_QUEUE_INTERVAL_S:-5}
      HOMOLOGATE_TZ: ${HOMOLOGATE_TZ:-America/Lima}
    depends_on:
      - mongo
    restart: unless-stopped

  tcp_bridge:
    build: ./tcp_bridge
    ports:
      - "9917:9917"
      - "19802:19802"
    environment:
      TCP_PORT: "9917"
      HTTP_PORT: "19802"
      BACKEND_URL: http://backend:19702
      IDLE_TIMEOUT_S: "300"
      ORPHAN_SWEEP_S: "30"
      FORWARD_LEGACY: "0"
    depends_on:
      port_cleaner:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "19602:19602"
    depends_on:
      - backend
    restart: unless-stopped

  ztrack:
    build:
      context: ./ztrack
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SERIAL_URL: http://localhost:19602
    ports:
      - "8451:8451"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data_9917:

# Subred fija: en servidores con muchos stacks el pool default de Docker se agota
# ("all predefined address pools have been fully subnetted").
networks:
  default:
    name: test_4g_madurador_miami_default
    ipam:
      config:
        - subnet: 10.102.7.0/24

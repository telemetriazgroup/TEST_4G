name: test_4g_usa_9921

services:
  port_cleaner:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./port_cleaner/clean.sh:/clean.sh:ro
    entrypoint: ["/bin/sh", "/clean.sh"]
    environment:
      CLEAN_PORT: "9921"
    restart: "no"

  mongo:
    image: mongo:7
    ports:
      - "29028:27017"
    volumes:
      - mongo_data_9921:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "9092:9092"
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: test_4g_9921
      BRIDGE_URL: http://tcp_bridge:8092
      HOMOLOGATE_URL: ${HOMOLOGATE_URL:-}
      HOMOLOGATE_UNIT: ${HOMOLOGATE_UNIT:-UNIT111}
      HOMOLOGATE_TIMEOUT_S: ${HOMOLOGATE_TIMEOUT_S:-5}
      HOMOLOGATE_ENABLED: ${HOMOLOGATE_ENABLED:-1}
      HOMOLOGATE_RETRIES: ${HOMOLOGATE_RETRIES:-3}
      HOMOLOGATE_DEDUP_S: ${HOMOLOGATE_DEDUP_S:-30}
      HOMOLOGATE_QUEUE_INTERVAL_S: ${HOMOLOGATE_QUEUE_INTERVAL_S:-5}
      HOMOLOGATE_TZ: ${HOMOLOGATE_TZ:-America/Lima}
    depends_on:
      - mongo
    restart: unless-stopped

  tcp_bridge:
    build: ./tcp_bridge
    ports:
      - "9921:9921"
      - "8092:8092"
    environment:
      TCP_PORT: "9921"
      HTTP_PORT: "8092"
      BACKEND_URL: http://backend:9092
      IDLE_TIMEOUT_S: "300"
      ORPHAN_SWEEP_S: "30"
      FORWARD_LEGACY: "0"
    depends_on:
      port_cleaner:
        condition: service_completed_successfully
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8100:8100"
    depends_on:
      - backend
    restart: unless-stopped

  ztrack:
    build:
      context: ./ztrack
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_SERIAL_URL: http://localhost:8100
    ports:
      - "8455:8455"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data_9921:
